[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-trip-planner"
version = "0.1.0"
description = "Describe, view, and refine a trip from your terminal."
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "Jinja2>=3.1.6,<4",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
trip-planner = "trip_planner.cli:main"

[tool.setuptools.packages.find]
include = ["trip_planner*"]

[tool.setuptools.package-data]
trip_planner = ["prompts/*.txt", "templates/*.j2", "static/*.css"]
